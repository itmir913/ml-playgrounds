<!DOCTYPE html>
<!--
  규정 서랍. **학운위 심의 서류에 적는 주소는 이 한 장이다** —
  처리방침·오픈소스 고지가 전부 여기서 갈라진다.

  왜 랜딩이 아니라 앱 저장소에 있는지는
  `docs/open-decisions.md` "바깥에 내놓는 규정은 앱이 데리고 간다"에 있다.

  **처리방침 링크는 하나다.** 언어마다 한 줄씩 늘어놓으면 언어가 열 개일 때 링크가
  열 개가 된다 — 읽는 사람은 자기 언어 하나만 필요하다. 그래서 이 페이지가 언어를
  고르고 **그 언어의 방침 한 장만** 가리킨다. 언어를 바꾸는 자리는 위의 토글이고,
  그 토글도 아래 표에서 자동으로 그려지므로 언어가 늘어도 여기 손댈 것은 표뿐이다.

  **오픈소스 고지는 영어 한 장뿐이다.** 빌드가 남의 저작권 표시와 허가문을 원문 그대로
  옮겨 굽는 파일이라(`scripts/notices.ts`) 번역할 것이 없다.

  **문구 표는 아래 JSON 한 곳이다.** `frontend/tests/legal.spec.ts`가 이 표의 언어가
  `i18n.ts`의 `SUPPORTED_LOCALES`와 같은지 본다 — 언어를 늘리고 여기를 안 채우면 운다.

  앱 번들 밖이라 Tailwind가 없다. 스타일은 이 파일이 전부 갖는다.
-->
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Legal · Machine Learning Playgrounds</title>
    <style>
        :root {
            --ink: #1f2937;
            --ink-soft: #4b5563;
            --ink-faint: #6b7280;
            --surface: #ffffff;
            --canvas: #f8fafc;
            --line: #e2e8f0;
            --brand: #4f46e5;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --ink: #e5e7eb;
                --ink-soft: #cbd5e1;
                --ink-faint: #94a3b8;
                --surface: #111827;
                --canvas: #0b1120;
                --line: #1f2937;
                --brand: #a5b4fc;
            }
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 2.5rem 1.25rem 5rem;
            background: var(--canvas);
            color: var(--ink);
            font-family: "Pretendard Variable", Pretendard, -apple-system, "Segoe UI",
                         "Malgun Gothic", sans-serif;
            font-size: 1rem;
            line-height: 1.75;
            overflow-wrap: break-word;
        }

        html[lang="ko"] body { word-break: keep-all; }

        main { max-width: 40rem; margin: 0 auto; }

        h1 { font-size: 1.75rem; line-height: 1.4; margin: 0 0 0.5rem; }

        .lead { color: var(--ink-faint); margin: 0 0 2rem; }

        /* 언어 토글. 고른 쪽만 채운다 — 소개 페이지와 같은 모양이다. */
        .langs {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin: 0 0 2rem;
        }

        .langs a {
            border: 1px solid var(--line);
            border-radius: 999px;
            padding: 0.25rem 0.875rem;
            color: var(--ink-faint);
            text-decoration: none;
        }

        .langs a[aria-current="page"] {
            background: var(--brand);
            border-color: var(--brand);
            color: #ffffff;
        }

        .card {
            display: block;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 0.875rem;
            padding: 1.25rem 1.5rem;
            margin-bottom: 0.875rem;
            text-decoration: none;
            color: inherit;
        }

        .card:hover { border-color: var(--brand); }

        .card h2 { font-size: 1.125rem; margin: 0 0 0.25rem; color: var(--brand); }
        .card p { margin: 0; color: var(--ink-soft); }
        .card .note { color: var(--ink-faint); }

        footer {
            max-width: 40rem;
            margin: 2rem auto 0;
            color: var(--ink-faint);
        }

        footer a { color: var(--brand); margin-right: 1rem; }
    </style>
</head>
<body>
<main>
    <h1 id="title"></h1>
    <p class="lead" id="lead"></p>

    <nav class="langs" id="langs" aria-label="Language"></nav>

    <a class="card" id="privacy" href="./privacy.en.html">
        <h2 id="privacy-title"></h2>
        <p id="privacy-body"></p>
    </a>

    <a class="card" href="../third-party-notices.txt">
        <h2 id="notices-title"></h2>
        <p id="notices-body"></p>
        <p class="note" id="notices-note"></p>
    </a>
</main>

<footer>
    <!--
      **소개 페이지만 절대 주소다.** 다른 링크는 전부 상대 경로여서 학교가 직접 띄운
      자가호스팅을 따라가지만, 소개 페이지는 배포 위치와 무관하게 한 곳에만 있다.
      고치지 마라 - 상대 경로로 바꾸면 자가호스팅에서 없는 주소를 가리킨다.
    -->
    <a href="https://luminousky.com/teacher-utility-kit/ml-playgrounds/" id="about"></a>
    <a href="../" id="back"></a>
</footer>

<!--
  **문구 표.** 언어를 늘릴 때 고치는 곳은 여기 하나다.
  `label`은 그 언어를 그 언어로 부르는 이름이다 — 토글이 이것으로 그려진다.
-->
<script type="application/json" id="messages">
{
  "en": {
    "label": "English",
    "title": "Legal documents",
    "lead": "Machine Learning Playgrounds",
    "privacyTitle": "Privacy policy",
    "privacyBody": "What this app does not collect, and where a student number or name you type ends up.",
    "noticesTitle": "Open source licenses",
    "noticesBody": "The open source this app ships and the permission notices that come with it.",
    "noticesNote": "Provided in English only.",
    "about": "About this app",
    "back": "Back to the app"
  },
  "ko": {
    "label": "한국어",
    "title": "규정 문서",
    "lead": "Machine Learning Playgrounds",
    "privacyTitle": "개인정보 처리방침",
    "privacyBody": "이 앱이 무엇을 수집하지 않는지, 적어 넣은 학번·이름이 어디에 남는지.",
    "noticesTitle": "오픈소스 라이선스",
    "noticesBody": "이 앱이 함께 싣고 있는 오픈소스와 그 허가문.",
    "noticesNote": "영어로만 제공됩니다.",
    "about": "소개 페이지",
    "back": "앱으로 돌아가기"
  }
}
</script>

<script>
    // 언어 결정: 주소의 ?lang= > 브라우저 선호 > 영어.
    // **앱과 같은 순서다**(`src/i18n.ts`의 resolveLocale). 여기는 저장된 선택을 못 읽는다 —
    // 이 페이지는 앱 밖이라 앱의 IndexedDB에 닿지 않는다.
    (function () {
        var messages = JSON.parse(document.getElementById('messages').textContent)
        var locales = Object.keys(messages)
        var fallback = 'en'

        function pick() {
            var asked = new URLSearchParams(location.search).get('lang')
            if (asked && messages[asked]) return asked
            var preferred = navigator.languages || [navigator.language || '']
            for (var i = 0; i < preferred.length; i += 1) {
                var tag = preferred[i] || ''
                if (messages[tag]) return tag
                var base = tag.split('-')[0]
                if (messages[base]) return base
            }
            return fallback
        }

        var locale = pick()
        var dict = messages[locale]

        document.documentElement.lang = locale
        document.title = dict.title + ' · Machine Learning Playgrounds'
        document.getElementById('title').textContent = dict.title
        document.getElementById('lead').textContent = dict.lead
        document.getElementById('privacy-title').textContent = dict.privacyTitle
        document.getElementById('privacy-body').textContent = dict.privacyBody
        document.getElementById('notices-title').textContent = dict.noticesTitle
        document.getElementById('notices-body').textContent = dict.noticesBody
        document.getElementById('notices-note').textContent = dict.noticesNote
        document.getElementById('back').textContent = dict.back

        // 소개 페이지는 ?lang= 을 읽는다. 여기서 고른 언어를 그대로 넘겨
        // 두 페이지가 서로 다른 언어로 열리지 않게 한다.
        var about = document.getElementById('about')
        about.textContent = dict.about
        about.href = 'https://luminousky.com/teacher-utility-kit/ml-playgrounds/?lang=' + locale

        // **방침은 한 장만 가리킨다.** 고른 언어의 것이다.
        document.getElementById('privacy').href = './privacy.' + locale + '.html'

        // 언어 토글. 표에서 그리므로 언어가 늘어도 이 코드는 그대로다.
        var nav = document.getElementById('langs')
        locales.forEach(function (code) {
            var link = document.createElement('a')
            link.href = '?lang=' + code
            link.textContent = messages[code].label
            link.lang = code
            if (code === locale) link.setAttribute('aria-current', 'page')
            nav.appendChild(link)
        })
    })()
</script>
</body>
</html>
