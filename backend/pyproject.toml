[project]
name = "ml-playgrounds-backend"
version = "0.1.0"
description = "ML Playgrounds backend - computes only, stores nothing"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.52.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    "websockets>=13.0",
    "pandas>=2.2",
    "numpy>=2.0",
    "scikit-learn>=1.5",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    # starlette의 TestClient가 쓴다. httpx가 아니라 httpx2인 이유는 starlette가 httpx를
    # 쓰면 DeprecationWarning을 내기 때문이다. 무시 설정으로 덮지 않는다 - 한 번 덮으면
    # 그 뒤로 진짜 경고까지 같이 죽는다.
    "httpx2>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "ANN"]
ignore = ["ANN401"]

[tool.mypy]
python_version = "3.12"
# scripts/ 의 CI 검사 스크립트를 테스트에서 import한다. conftest.py가 sys.path에 넣는다.
mypy_path = "../scripts"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
