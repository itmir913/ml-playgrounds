name: Deploy frontend

# Manual only. Pushing to main does not deploy - an unintended deploy during a
# class is a real accident here (docs/open-decisions.md #10-1).
# One-time setup: repository Settings -> Pages -> Source must be "GitHub Actions".
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # **배포를 거는 것은 `gate.yml` 하나이고, CI가 부르는 것과 같은 파일이다.**
  #
  # 전에는 이 파일이 `npm run ci` 한 줄만 돌렸고 `ci.yml`은 잡 셋을 돌렸다. 그래서 같은
  # 커밋에서 **CI는 빨갛고 배포는 초록**이었고 어휘 계약이 깨진 커밋이 그대로 나갔다
  # (`0.23.0`, 2026-09-21). *"이 파일만 읽어도 무엇이 통과해야 나가는지 알 수 있어야
  # 한다"*는 원래 의도가 **실제로 거는 것보다 넓었다** — 이제 한 줄이 그 셋을 전부 건다.
  #
  # `pages: true`가 관문 안에서 빌드한 `dist/`를 그대로 아티팩트로 올린다. 배포가 다시
  # 빌드하지 않는 이유가 그것이다 — 두 번 빌드하면 **나가는 것이 관문을 통과한 그
  # 바이트인지**를 아무도 보증하지 못한다.
  gate:
    name: Gate
    uses: ./.github/workflows/gate.yml
    with:
      pages: true

  deploy:
    name: Deploy
    needs: gate
    runs-on: ubuntu-latest
    # Never cancelled. A deployment cut off partway can leave the site broken.
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
