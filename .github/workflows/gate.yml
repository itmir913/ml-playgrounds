name: Gate

# **관문의 정의는 여기 하나다.** `ci.yml`(push·PR)과 `deploy.yml`(수동 배포)이 둘 다
# 이 파일을 부른다.
#
# **왜 합쳤나** (2026-09-21). 전에는 `ci.yml`이 잡 셋을 돌리고 `deploy.yml`은 그중
# `npm run ci` **하나만** 돌렸다. 그래서 같은 커밋에서 CI는 빨갛고 배포는 초록이었고,
# **어휘 계약이 깨진 커밋이 그대로 나갔다** (`0.23.0`, `FEATURE_NOT_NUMBER`가 프런트의
# SHARED_ERROR_CODES에만 있고 백엔드 ErrorCode에는 없던 자리).
#
# 이 저장소는 같은 병을 스크립트 층에서 이미 두 번 앓고 고쳤다 — 관문 단계를 워크플로에
# 풀어 쓰면 **스크립트에 검사를 더한 사람이 워크플로를 안 고쳐 조용히 빠진다.** 그래서
# `npm run ci`와 `backend/scripts/ci.py`가 각각 정의 하나가 됐다. **워크플로 층에도 같은
# 규칙을 적용한 것이 이 파일이다** — 검사를 더할 곳이 하나여야 배포가 CI보다 관대해지지
# 않는다.

on:
  workflow_call:
    inputs:
      pages:
        description: 'dist/를 Pages 아티팩트로 올린다. 배포 경로만 켠다.'
        type: boolean
        default: false

# **권한을 여기서 선언하지 않는다.** 부르는 쪽의 것을 그대로 물려받는다 — 재사용
# 워크플로는 권한을 올릴 수 없으므로, 여기서 좁혀 두면 배포 경로의 아티팩트 올리기가
# 부르는 쪽 설정과 무관하게 막힐 수 있다. 좁히는 것은 부르는 파일의 일이다.

jobs:
  contracts:
    name: Contract check (locale <-> backend code)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      # Only standard library is used, so no dependency installation is needed.
      - run: python scripts/check_locales.py

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
      # 관문의 정의는 `backend/scripts/ci.py` 하나다 — lint · format · types · tests.
      # 여기서 단계를 풀어 쓰고 있었는데, 그러면 검사를 더한 사람이 이 파일을 안
      # 고쳤을 때 **관문에서만 조용히 빠진다.** 프런트엔드가 실제로 그렇게 당했다
      # (아래 `npm run ci` 옆의 주석).
      - run: uv run python scripts/ci.py

  # sklearn 대조 픽스처의 낡음 검사는 **여기 따로 있지 않다** (2026-08-28). `npm run ci`
  # 안으로 들어갔다 — 정의가 둘이면 하나만 고쳐진다 (open-decisions.md "sklearn 대조
  # 픽스처가 CI 관문에 들어간다"의 2026-08-28 각주). 그래서 아래 frontend 잡에 uv가 있다.

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Matches engines in package.json. A transitive dependency of jsdom 30
          # requires node >= 22.13, and npm only warns about engines, so a lower
          # node here fails at runtime instead of at install time.
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # `npm run ci`가 sklearn 픽스처 낡음 검사를 부른다. 없으면 관문이 선다 —
      # 건너뛰게 만들지 않는다(조용한 초록이 그 검사가 막으려는 실패다).
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
        working-directory: backend
      # 관문의 정의는 `package.json`의 `ci` 스크립트 하나다 — backbones · pyodide ·
      # lint:check · typecheck · vitest · fixtures:check · build. 여기서 단계를 하나씩
      # 풀어 쓰고 있었는데, 그러면 스크립트에 검사를 더한 사람이 이 파일을 안 고쳤을 때
      # **push 관문에서만 조용히 빠진다.** 실제로 그랬다 — 백본 가중치 받기는 `ci`에
      # 이미 있었는데 여기에는 없어서 나중에 따로 넣어야 했다(`40e5c63`).
      #
      # 이 안의 순서에는 이유가 있으니 스크립트를 고칠 때 함께 봐라.
      # - 백본 가중치가 vitest보다 앞이다. tests/backbones.spec.ts가 model.json을 읽어
      #   등록부와 대조한다 — 파일이 없을 때 건너뛰게 만들면 가중치가 등록부와 어긋나는
      #   날 조용히 통과한다.
      # - 린트는 `lint`가 아니라 `lint:check`다. `lint`는 `--fix`가 붙어 있어 위반을
      #   러너에서 고쳐 통과시키고, 그 수정은 러너와 함께 버려진다(`556d6d4`).
      - run: npm run ci
      # **배포 경로만 올린다.** 빌드는 관문 안에서 이미 났으므로 배포가 다시 빌드하지
      # 않는다 — 두 번 빌드하면 **나가는 것이 관문을 통과한 그 바이트인지**를 아무도
      # 보증하지 못한다.
      - if: inputs.pages
        uses: actions/upload-pages-artifact@v5
        with:
          # Relative to the workspace root - defaults.run does not apply here.
          path: frontend/dist
