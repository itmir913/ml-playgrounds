name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # **관문의 정의는 `gate.yml` 하나다.** 여기에 단계를 풀어 쓰지 마라 — 그러면
  # `deploy.yml`과 갈리고, 갈리면 **배포가 CI보다 관대해진다.** 2026-09-21에 실제로
  # 그랬다(`0.23.0`이 CI 빨간 채로 나갔다).
  gate:
    name: Gate
    uses: ./.github/workflows/gate.yml
