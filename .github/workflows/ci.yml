name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Contract check (locale <-> backend code)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      # Only standard library is used, so no dependency installation is needed.
      - run: python scripts/check_locales.py

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
      # 관문의 정의는 `backend/scripts/ci.py` 하나다 — lint · format · types · tests.
      # 여기서 단계를 풀어 쓰고 있었는데, 그러면 검사를 더한 사람이 이 파일을 안
      # 고쳤을 때 **관문에서만 조용히 빠진다.** 프런트엔드가 실제로 그렇게 당했다
      # (아래 `npm run ci` 옆의 주석).
      - run: uv run python scripts/ci.py

  # sklearn 대조 픽스처가 낡지 않았는지. 기본 관문(vitest의 sklearn-parity.spec.ts)은
  # frontend 잡 안에서 파이썬 없이 돌고, 이 잡은 픽스처의 기대값 자체를 sklearn으로
  # 재계산해 커밋된 것과 대조한다 (open-decisions.md "sklearn 대조 픽스처가 CI 관문에
  # 들어간다"). sklearn 버전은 backend/uv.lock이 못박는다.
  ml-fixtures:
    name: ML fixtures (sklearn parity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
        working-directory: backend
      - name: fixtures up to date
        run: uv run --project backend python scripts/generate_sklearn_fixtures.py --check

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Matches engines in package.json. A transitive dependency of jsdom 30
          # requires node >= 22.13, and npm only warns about engines, so a lower
          # node here fails at runtime instead of at install time.
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # 관문의 정의는 `package.json`의 `ci` 스크립트 하나다 — backbones · lint:check ·
      # typecheck · vitest · build. 여기서 단계를 하나씩 풀어 쓰고 있었는데, 그러면
      # 스크립트에 검사를 더한 사람이 이 파일을 안 고쳤을 때 **push 관문에서만 조용히
      # 빠진다.** 실제로 그랬다 — 백본 가중치 받기는 `ci`에 이미 있었는데 여기에는
      # 없어서 나중에 따로 넣어야 했다(`40e5c63`). `deploy.yml`도 같은 한 줄을 부른다.
      #
      # 이 안의 순서에는 이유가 있으니 스크립트를 고칠 때 함께 봐라.
      # - 백본 가중치가 vitest보다 앞이다. tests/backbones.spec.ts가 model.json을 읽어
      #   등록부와 대조한다 — 파일이 없을 때 건너뛰게 만들면 가중치가 등록부와 어긋나는
      #   날 조용히 통과한다.
      # - 린트는 `lint`가 아니라 `lint:check`다. `lint`는 `--fix`가 붙어 있어 위반을
      #   러너에서 고쳐 통과시키고, 그 수정은 러너와 함께 버려진다(`556d6d4`).
      - run: npm run ci
