name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Contract check (locale <-> backend code)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      # Only standard library is used, so no dependency installation is needed.
      - run: python scripts/check_locales.py

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
      - name: ruff (lint)
        run: uv run ruff check .
      - name: ruff (format)
        run: uv run ruff format --check .
      - name: mypy
        run: uv run mypy .
      - name: pytest
        run: uv run pytest

  # sklearn 대조 픽스처가 낡지 않았는지. 기본 관문(vitest의 sklearn-parity.spec.ts)은
  # frontend 잡 안에서 파이썬 없이 돌고, 이 잡은 픽스처의 기대값 자체를 sklearn으로
  # 재계산해 커밋된 것과 대조한다 (open-decisions.md "sklearn 대조 픽스처가 CI 관문에
  # 들어간다"). sklearn 버전은 backend/uv.lock이 못박는다.
  ml-fixtures:
    name: ML fixtures (sklearn parity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
        working-directory: backend
      - name: fixtures up to date
        run: uv run --project backend python scripts/generate_sklearn_fixtures.py --check

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Matches engines in package.json. A transitive dependency of jsdom 30
          # requires node >= 22.13, and npm only warns about engines, so a lower
          # node here fails at runtime instead of at install time.
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: eslint
        run: npm run lint -- --no-fix
      - name: prettier
        run: npx prettier --check src/ tests/
      - name: vue-tsc
        run: npm run typecheck
      - name: vitest
        run: npm test
      - name: build
        run: npm run build
