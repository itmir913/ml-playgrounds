name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Contract check (locale <-> backend code)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      # Only standard library is used, so no dependency installation is needed.
      - run: python scripts/check_locales.py

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
      - name: ruff (lint)
        run: uv run ruff check .
      - name: ruff (format)
        run: uv run ruff format --check .
      - name: mypy
        run: uv run mypy .
      - name: pytest
        run: uv run pytest

  # sklearn 대조 픽스처가 낡지 않았는지. 기본 관문(vitest의 sklearn-parity.spec.ts)은
  # frontend 잡 안에서 파이썬 없이 돌고, 이 잡은 픽스처의 기대값 자체를 sklearn으로
  # 재계산해 커밋된 것과 대조한다 (open-decisions.md "sklearn 대조 픽스처가 CI 관문에
  # 들어간다"). sklearn 버전은 backend/uv.lock이 못박는다.
  ml-fixtures:
    name: ML fixtures (sklearn parity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
        working-directory: backend
      - name: fixtures up to date
        run: uv run --project backend python scripts/generate_sklearn_fixtures.py --check

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Matches engines in package.json. A transitive dependency of jsdom 30
          # requires node >= 22.13, and npm only warns about engines, so a lower
          # node here fails at runtime instead of at install time.
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # vitest보다 먼저 받아야 한다. 가중치를 받는 것은 `backbones` 스크립트인데 그것이
      # 붙어 있는 곳은 `ci`와 `build`이고, 이 잡은 단계를 하나씩 부르므로 vitest가 build
      # 앞에 선다. tests/backbones.spec.ts가 model.json을 읽어 등록부와 대조한다 —
      # 파일이 없을 때 건너뛰게 만들면 가중치가 등록부와 어긋나는 날 조용히 통과한다.
      - name: backbone weights
        run: npm run backbones
      # `npm run lint -- --no-fix`가 아니다. npm은 `--` 뒤의 인자를 스크립트 문자열
      # 끝에 붙이는데, lint는 `&&`로 이어진 두 명령이라 `--no-fix`가 eslint가 아니라
      # prettier에 붙었다. 그래서 이 단계가 `eslint . --fix`로 돌았고, 자동 수정되는
      # 위반은 여기서 조용히 고쳐져 통과한 뒤 그 수정은 러너와 함께 버려졌다.
      - name: eslint
        run: npx eslint .
      - name: prettier
        run: npx prettier --check src/ tests/
      - name: vue-tsc
        run: npm run typecheck
      - name: vitest
        run: npm test
      - name: build
        run: npm run build
